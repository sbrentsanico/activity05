# Database connection (supports environment variables or local H2 fallback)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/shopdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
# Driver auto-detected from URL (H2 for local fallback, PostgreSQL when DB_URL is set)

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Port
server.port=8080

